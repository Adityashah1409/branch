name: Odoo 20 tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: odoo
      PGPASSWORD: odoo
    steps:
      - uses: actions/checkout@v4
        with:
          path: branch

      - name: Checkout Odoo 20.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "20.0"
          path: odoo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libpq-dev postgresql-client

      - name: Python dependencies
        run: |
          pip install --upgrade pip wheel setuptools
          pip install -r odoo/requirements.txt
          pip install websocket-client

      - name: Configure Odoo
        run: |
          printf "[options]\ndb_host = localhost\ndb_port = 5432\ndb_user = odoo\ndb_password = odoo\n" > ~/.odoorc

      - name: Install modules and run tests
        run: branch/tools/run_tests.sh "$GITHUB_WORKSPACE/odoo" branch_ci python
